<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ViMessias Play · Overlay</title>
  <link rel="stylesheet" href="extension.css">
  <script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>
  <script src="overlay.js" defer></script>
</head>
<body class="overlay-page">
  <main id="content" class="content-window" aria-label="Conteúdo autorizado da live">
    <video id="media" playsinline controls preload="none" aria-label="Vídeo autorizado"></video>
    <div class="video-placeholder" id="placeholder">
      <span class="brand-mark" aria-hidden="true">VP</span>
      <strong id="videoTitle">Overlay ViMessias Play</strong>
      <span id="message">Aguardando configuração do canal.</span>
      <button id="play" type="button" hidden>▶ Reproduzir</button>
    </div>
    <button id="sound" class="sound-button" type="button" aria-label="Ativar som" hidden>♪ Som</button>
  </main>
</body>
</html>
